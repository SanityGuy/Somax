[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "somax-lang"
version = "1.0.0"
description = "Somax programming language interpreter"
requires-python = ">=3.10"

[project.scripts]
somax = "somax.main:main"

[tool.setuptools.packages.find]
where = ["src"]
